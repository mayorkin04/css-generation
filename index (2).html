<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор градиентов</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg: #0c0c14;
            --surface: #141420;
            --surface-hover: #1a1a2e;
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --text: #e8e8f0;
            --text-muted: #6e6e8a;
            --text-dim: #4a4a62;
            --accent: #7c7cff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 20px;
            line-height: 1.5;
        }

        /* --- Noise texture overlay --- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1000;
        }

        /* --- Header --- */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .brand span {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 500;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: background 0.4s ease;
        }

        /* --- Layout --- */
        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* --- Preview Card --- */
        .preview-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--surface);
        }

        .preview-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent 40%, transparent 60%, rgba(255,255,255,0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .preview-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .window-dots {
            display: flex;
            gap: 6px;
        }

        .window-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: block;
        }

        .window-dots span:nth-child(1) { background: #ff5f57; }
        .window-dots span:nth-child(2) { background: #febc2e; }
        .window-dots span:nth-child(3) { background: #28c840; }

        .preview-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .preview-dimensions {
            font-size: 0.7rem;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .preview-box {
            width: 100%;
            height: 280px;
            transition: background 0.3s ease;
            position: relative;
        }

        .preview-box::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(12,12,20,0.3) 0%, transparent 30%, transparent 70%, rgba(12,12,20,0.4) 100%);
            pointer-events: none;
        }

        /* --- Controls Panel --- */
        .controls {
            background: var(--surface);
            border-radius: 20px;
            padding: 28px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 24px;
            align-items: end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-swatch-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="color"] {
            width: 52px;
            height: 52px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            background: none;
            padding: 3px;
            transition: transform 0.15s ease;
        }

        input[type="color"]:hover {
            transform: scale(1.05);
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border-hover);
            border-radius: 11px;
        }

        .hex-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text);
            background: var(--bg);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            min-width: 90px;
            text-align: center;
            letter-spacing: 0.05em;
        }

        /* --- Angle Control --- */
        .angle-control {
            grid-column: 1 / -1;
        }

        .angle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .angle-value-box {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text);
            background: var(--bg);
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-weight: 500;
        }

        .slider-track {
            position: relative;
            height: 6px;
            background: var(--bg);
            border-radius: 3px;
            margin-bottom: 8px;
        }

        .slider-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            border-radius: 3px;
            transition: width 0.1s ease;
            pointer-events: none;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: transparent;
            outline: none;
            -webkit-appearance: none;
            position: relative;
            z-index: 2;
            margin-top: -6px;
            display: block;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--text);
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4), 0 0 0 3px var(--surface);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 2px 16px rgba(0,0,0,0.5), 0 0 0 4px var(--surface);
        }

        .angle-presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .preset-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            border-color: var(--border-hover);
            color: var(--text);
            background: var(--surface-hover);
        }

        .preset-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(124,124,255,0.08);
        }

        /* --- Random Button --- */
        .btn-random {
            grid-column: 1 / -1;
            padding: 14px 28px;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--surface-hover);
            color: var(--text);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .btn-random::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(124,124,255,0.15), rgba(78,205,196,0.15));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-random:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .btn-random:hover::before {
            opacity: 1;
        }

        .btn-random:active {
            transform: translateY(0);
        }

        .btn-random span {
            position: relative;
            z-index: 1;
        }

        /* --- Code Block --- */
        .code-card {
            background: var(--surface);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
        }

        .code-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .code-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .code-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-copy {
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            font-family: 'Space Grotesk', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-copy:hover {
            border-color: var(--border-hover);
            color: var(--text);
            background: var(--surface-hover);
        }

        .btn-copy.copied {
            border-color: #2ecc71;
            color: #2ecc71;
            background: rgba(46,204,113,0.08);
        }

        pre {
            padding: 20px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
            color: #a0a0c0;
        }

        .token-prop { color: #7c7cff; }
        .token-val { color: #4ecdc4; }
        .token-punc { color: #6e6e8a; }
        .token-num { color: #ff9f43; }

        /* --- Toast --- */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--surface);
            color: var(--text);
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #2ecc71;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        /* --- Footer --- */
        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        /* --- Responsive --- */
        @media (max-width: 520px) {
            body { padding: 20px 16px; }
            .controls { padding: 20px; grid-template-columns: 1fr; }
            .preview-box { height: 220px; }
            .angle-control { grid-column: 1; }
            .btn-random { grid-column: 1; }
        }
    </style>
</head>
<body>
    <div class="brand">
        <div class="brand-dot"></div>
        <span>Инструмент разработчика</span>
    </div>

    <h1 id="mainTitle">Генератор градиентов</h1>

    <div class="container">
        <!-- Preview -->
        <div class="preview-card">
            <div class="preview-header">
                <div class="preview-header-left">
                    <div class="window-dots">
                        <span></span><span></span><span></span>
                    </div>
                    <span class="preview-label">Предпросмотр</span>
                </div>
                <span class="preview-dimensions">100% × 280px</span>
            </div>
            <div class="preview-box" id="preview"></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <div class="control-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>
                    Начальный цвет
                </div>
                <div class="color-swatch-wrapper">
                    <input type="color" id="color1" value="#FF5733">
                    <span class="hex-value" id="hex1">#FF5733</span>
                </div>
            </div>

            <div class="control-group">
                <div class="control-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>
                    Конечный цвет
                </div>
                <div class="color-swatch-wrapper">
                    <input type="color" id="color2" value="#33FF57">
                    <span class="hex-value" id="hex2">#33FF57</span>
                </div>
            </div>

            <div class="control-group angle-control">
                <div class="angle-header">
                    <div class="control-label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
                        Угол направления
                    </div>
                    <span class="angle-value-box" id="angleValue">90°</span>
                </div>
                <div class="slider-track">
                    <div class="slider-fill" id="sliderFill"></div>
                </div>
                <input type="range" id="angle" min="0" max="360" value="90">
                <div class="angle-presets" id="anglePresets">
                    <button class="preset-btn" data-angle="0">0°</button>
                    <button class="preset-btn" data-angle="45">45°</button>
                    <button class="preset-btn" data-angle="90">90°</button>
                    <button class="preset-btn" data-angle="135">135°</button>
                    <button class="preset-btn" data-angle="180">180°</button>
                    <button class="preset-btn" data-angle="225">225°</button>
                    <button class="preset-btn" data-angle="270">270°</button>
                    <button class="preset-btn" data-angle="315">315°</button>
                </div>
            </div>

            <button class="btn-random" id="randomBtn">
                <span>⟳ Случайный градиент</span>
            </button>
        </div>

        <!-- Code -->
        <div class="code-card">
            <div class="code-header">
                <div class="code-header-left">
                    <div class="code-icon">{}</div>
                    <span class="code-title">CSS</span>
                </div>
                <button class="btn-copy" id="copyBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Копировать
                </button>
            </div>
            <pre id="codeOutput"><span class="token-prop">background</span><span class="token-punc">:</span> <span class="token-val">linear-gradient</span><span class="token-punc">(</span><span class="token-num">90</span><span class="token-val">deg</span><span class="token-punc">,</span> <span class="token-val">#FF5733</span><span class="token-punc">,</span> <span class="token-val">#33FF57</span><span class="token-punc">);</span></pre>
        </div>
    </div>

    <footer>
        Работает локально в браузере · Без отправки данных
    </footer>

    <div class="toast" id="toast">
        <div class="toast-icon">✓</div>
        <span>CSS скопирован в буфер обмена</span>
    </div>

    <script>
        const preview = document.getElementById('preview');
        const mainTitle = document.getElementById('mainTitle');
        const color1Input = document.getElementById('color1');
        const color2Input = document.getElementById('color2');
        const hex1 = document.getElementById('hex1');
        const hex2 = document.getElementById('hex2');
        const angleInput = document.getElementById('angle');
        const angleValue = document.getElementById('angleValue');
        const sliderFill = document.getElementById('sliderFill');
        const codeOutput = document.getElementById('codeOutput');
        const copyBtn = document.getElementById('copyBtn');
        const randomBtn = document.getElementById('randomBtn');
        const toast = document.getElementById('toast');
        const presetBtns = document.querySelectorAll('.preset-btn');

        function updateGradient() {
            const c1 = color1Input.value;
            const c2 = color2Input.value;
            const angle = angleInput.value;
            const gradient = `linear-gradient(${angle}deg, ${c1}, ${c2})`;

            preview.style.background = gradient;
            mainTitle.style.background = gradient;
            mainTitle.style.webkitBackgroundClip = 'text';
            mainTitle.style.webkitTextFillColor = 'transparent';
            mainTitle.style.backgroundClip = 'text';

            hex1.textContent = c1.toUpperCase();
            hex2.textContent = c2.toUpperCase();
            angleValue.textContent = `${angle}°`;
            sliderFill.style.width = `${(angle / 360) * 100}%`;
            sliderFill.style.background = gradient;

            // Syntax highlighting
            codeOutput.innerHTML = `<span class="token-prop">background</span><span class="token-punc">:</span> <span class="token-val">linear-gradient</span><span class="token-punc">(</span><span class="token-num">${angle}</span><span class="token-val">deg</span><span class="token-punc">,</span> <span class="token-val">${c1.toUpperCase()}</span><span class="token-punc">,</span> <span class="token-val">${c2.toUpperCase()}</span><span class="token-punc">);</span>`;

            // Update presets
            presetBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.angle) === parseInt(angle));
            });
        }

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) color += letters[Math.floor(Math.random() * 16)];
            return color;
        }

        function randomGradient() {
            color1Input.value = getRandomColor();
            color2Input.value = getRandomColor();
            angleInput.value = Math.floor(Math.random() * 361);
            updateGradient();
        }

        async function copyCode() {
            const code = `background: linear-gradient(${angleInput.value}deg, ${color1Input.value}, ${color2Input.value});`;
            try {
                await navigator.clipboard.writeText(code);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = code;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Скопировано`;
            showToast();
            setTimeout(() => {
                copyBtn.classList.remove('copied');
                copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Копировать`;
            }, 2000);
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }

        color1Input.addEventListener('input', updateGradient);
        color2Input.addEventListener('input', updateGradient);
        angleInput.addEventListener('input', updateGradient);
        copyBtn.addEventListener('click', copyCode);
        randomBtn.addEventListener('click', randomGradient);

        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                angleInput.value = btn.dataset.angle;
                updateGradient();
            });
        });

        updateGradient();
    </script>
</body>
</html>
